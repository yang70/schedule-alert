# HTTP bootstrap configuration. Certbot adds TLS after this config passes nginx -t.
upstream tourneyping {
  server 127.0.0.1:3000;
}

server {
  listen 80;
  server_name tourneyping.com www.tourneyping.com;
  access_log /var/log/nginx/tourneyping_access.log;
  error_log /var/log/nginx/tourneyping_error.log;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 1M;

  location / {
    proxy_pass http://tourneyping;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
