:concurrency: 4
:timeout: 60
:queues:
  - default
  - mailers
:schedule:
  check_all_urls:
    cron: '* * * * *'
    class: CheckAllUrlsJob
    queue: default
  deliver_pending_notifications:
    cron: '* * * * *'
    class: DeliverPendingNotificationsJob
    queue: default
  prune_schedule_analyses:
    cron: '20 3 * * * America/Los_Angeles'
    class: PruneScheduleAnalysesJob
    queue: default
