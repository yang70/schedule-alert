default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", 10) %>

development:
  <<: *default
  database: schedule_development

test:
  <<: *default
  database: schedule_test
  # Ignore a development/production DATABASE_URL when running tests.
  url: <%= ENV["TEST_DATABASE_URL"] || (ENV["DATABASE_URL"].to_s.match?(%r{/[A-Za-z0-9_-]+_test(?:\?.*)?\z}) ? ENV["DATABASE_URL"] : "postgresql:///schedule_test") %>

production:
  <<: *default
  database: schedule_production
  username: ubuntu
  password: <%= ENV["SCHEDULE_DATABASE_PASSWORD"] %>
