# Optional Kamal alternative; the default deployment uses Lightsail/systemd.
service: tourneyping
image: <%= ENV.fetch("KAMAL_IMAGE", "your-account/tourneyping") %>
servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST", "44.226.63.157") %>
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST", "44.226.63.157") %>
    cmd: bundle exec sidekiq -C config/sidekiq.yml
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "tourneyping.com") %>
  app_port: 3000
  healthcheck:
    path: /up
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "your-account") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  clear:
    RAILS_ENV: production
    PUMA_BIND: tcp://0.0.0.0:3000
    APP_HOST: <%= ENV.fetch("APP_HOST", "tourneyping.com") %>
    FROM_EMAIL: <%= ENV.fetch("FROM_EMAIL", "noreply@tourneyping.com") %>
    SMTP_ADDRESS: smtp.sendgrid.net
    SMTP_USERNAME: apikey
    SMTP_PORT: 587
    BROWSER_CONCURRENCY: 1
    DB_POOL: 10
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - REDIS_URL
    - OPENAI_API_KEY
    - SMTP_PASSWORD
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
builder:
  arch: amd64
