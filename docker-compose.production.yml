services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourneyping
      POSTGRES_DB: schedule_production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tourneyping']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ['redis_data:/data']
  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://tourneyping:${POSTGRES_PASSWORD}@db:5432/schedule_production
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://tourneyping:${POSTGRES_PASSWORD}@db:5432/schedule_production
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
  redis_data:
