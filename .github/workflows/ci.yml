name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schedule_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedule_test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: npm test
      - run: NODE_ENV=production npm run build
      - run: npm audit
      - run: bin/bundler-audit check --update
      - run: bin/brakeman --no-pager --exit-on-warn --exit-on-error
      - run: bin/rubocop
      - run: bash -n bin/deploy.sh bin/deploy-remote.sh bin/lightsail-setup.sh
